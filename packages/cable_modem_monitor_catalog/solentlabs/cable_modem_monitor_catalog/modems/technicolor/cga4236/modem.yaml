manufacturer: Technicolor
model: CGA4236
model_aliases:
  - CGA4236TCH1
transport: http
default_host: "192.168.100.1"

auth:
  strategy: form_pbkdf2
  login_endpoint: "/api/v1/session/login"
  cookie_name: "PHPSESSID"

  csrf_header: "X-CSRF-TOKEN"
  csrf_init_endpoint: "/api/v1/session/language"
  double_hash: true
  pbkdf2_iterations: 1000
  pbkdf2_key_length: 128
  login_success:
    error: "ok"

session:
  headers:
    X-Requested-With: "XMLHttpRequest"
    Referer: "{base_url}/"
  post_login_endpoints:
    - "/api/v1/session/menu"

hardware:
  docsis_version: "3.1"
  chipset: "Broadcom BCM3390"
  release_date: "2020"

status: awaiting_verification

sources:
  release_date: "[FCC grants for CGA4236 (G95-CGA4236)](https://fcc.report/FCC-ID/G95-CGA4236) — FCC grant proxy, earliest grant 2020-06-23; no ISP/manufacturer launch announcement found"
  model_aliases: "[device.report — Technicolor CGA4236TCH1](https://device.report/technicolor/cga4236tch1)"
  auth_config:
    "[#115 Technicolor CGA4236](https://github.com/solentlabs/cable_modem_monitor/issues/115)
    — PBKDF2 double-hash auth"
  chipset: "[DeviWiki CGA4233](https://deviwiki.com/wiki/Technicolor_CGA4233) — same BCM3390 platform as CGA4233 family"
  session_headers: "2026-09-27 sanitized CGA4236TCH1 browser HAR (local capture): login and post-login API requests include X-Requested-With and Referer"
  post_login_endpoints: "2026-09-27 sanitized CGA4236TCH1 browser HAR (local capture): /api/v1/session/menu returns 401 before login and 200 after login"

attribution:
  contributors:
    - github: https://github.com/makerwolf
      contribution: "HAR capture (Issue #115)"

isps:
  - Unknown

notes: |
  DOCSIS 3.1 gateway. Same Technicolor REST platform as CGA6444VF.
  JSON API at /api/v1/. PBKDF2 double-hash auth: first POST returns
  salt + saltwebui, client hashes password with both salts, sends
  hashed result. PHPSESSID + X-CSRF-TOKEN (rotating per response).
  Browser API requests carry X-Requested-With and Referer; the browser
  fetches /api/v1/session/menu after login before loading protected data.
  Channel data from single /api/v1/modem/ endpoint with comma-separated
  table names. System info from /api/v1/system/ endpoint.
  PBKDF2 parameters from HAR JavaScript (sjcl.js): iterations and key
  length are firmware defaults, may need verification per firmware version.
  Processor speed: 1503 MHz (BCM3390, hardware-fixed; documented here, not parsed as a live sensor).

references:
  issues:
    - "[#115 — [Modem Request] Technicolor CGA4236](https://github.com/solentlabs/cable_modem_monitor/issues/115)"
